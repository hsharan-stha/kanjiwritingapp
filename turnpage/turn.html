  <script type="text/javascript">
    let display =
      localStorage.getItem("orientation") == 90 ? "double" : "single";

    $("#flipbook").turn({
      height: "100%",
      width: "100%",
      display: display,
      // Restore the saved page
      page: parseInt(localStorage.getItem("currentPage")) || 1,
    });

    const totalPages = $("#flipbook").turn("pages");
    document.getElementById("pages").innerText = totalPages;
    const pageWhileLoaded = $("#flipbook").turn("page");
    document.getElementById("currentPage").innerText = pageWhileLoaded;

    $("#flipbook").bind("turned", function (event, page) {
      localStorage.setItem("currentPage", page);

      document.getElementById("currentPage").innerText = page;
      document.getElementById("pageInput").value = page;

      refreshSelect(page);
    });

    window.addEventListener("orientationchange", function ($event) {
      console.log(event);
      localStorage.setItem("orientation", window.orientation);
      window.location.reload();
    });

    swipeEvent(document.body);

    function swipeEvent(body) {
      let xDown = null;
      let yDown = null;
      let pinchDetected = false;

      body.addEventListener("touchstart", handleTouchStart, false);
      body.addEventListener("touchmove", handleTouchMove, false);
      body.addEventListener("touchend", handleTouchEnd, false);

      function getDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function handleTouchStart(evt) {
        pinchDetected = false;
        if (evt.touches.length === 1) {
          xDown = evt.touches[0].clientX;
          yDown = evt.touches[0].clientY;
        }
      }

      function handleTouchMove(evt) {
        if (evt.touches.length === 2) {
          pinchDetected = true;
        }
      }

      function handleTouchEnd(evt) {
        if (pinchDetected) return;

        if (!xDown || !yDown) return;

        const xUp = evt.changedTouches[0].clientX;
        const yUp = evt.changedTouches[0].clientY;

        const dx = xUp - xDown;
        const dy = yUp - yDown;

        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 50) {
            fadeAndTurnPage("right");
          } else if (dx < -50) {
            fadeAndTurnPage("left");
          }
        }

        xDown = null;
        yDown = null;
      }

      function fadeAndTurnPage(direction) {
        const viewer = document.getElementById("flipbook");

        // Fade out
        viewer.classList.remove("opacity-100");
        viewer.classList.add("opacity-0");

        // Turn page
        if (direction === "left") {
          $("#flipbook").turn("next");
        } else if (direction === "right") {
          $("#flipbook").turn("previous");
        }

        // Fade in
        setTimeout(() => {
          viewer.classList.remove("opacity-0");
          viewer.classList.add("opacity-100");
        }, 100); // Add slight delay for visual effect
      }
    }

    const select = document.getElementById("pageInput");

    for (let i = 1; i <= 138; i++) {
      const option = document.createElement("option");
      option.value = i;
      option.textContent = `Page ${i}`;
      select.appendChild(option);
    }

    document.getElementById("pageInput").value = pageWhileLoaded;

    localStorage.removeItem("currentPageHistory");
    document.getElementById("backPage").style.display = "none";
    document
      .getElementById("pageInput")
      .addEventListener("change", function () {
        const selectedPage = parseInt($(this).val());
        const localStorageCurrentPage = localStorage.getItem("currentPage");
        localStorage.setItem("currentPageHistory", localStorageCurrentPage);
        document.getElementById("backPage").style.display = "flex";
        $("#flipbook").turn("page", selectedPage);
      });

    document.getElementById("flipbook").addEventListener("click", function () {
      const controls = document.getElementById("pagination");
      const bookmarks = document.getElementById("bookmark");

      controls.classList.toggle("hidden");
      bookmarks.classList.toggle("hidden");
    });

    document.getElementById("backPage").addEventListener("click", function () {
      $("#flipbook").turn("page", localStorage.getItem("currentPageHistory"));
      refreshSelect(localStorage.getItem("currentPageHistory"));
      // document.getElementById("backPage").style.display = "none";
      // localStorage.removeItem("currentPageHistory");
    });

    function refreshSelect(page) {
      const pageInput = document.getElementById("pageInput");

      pageInput.blur();

      const $select = $(pageInput);
      setTimeout(() => {
        $select.find("option").prop("selected", false); // Deselect all
        $select.find(`option[value='${page}']`).prop("selected", true); // Select current
      }, 10);
    }

    document.getElementById("bookmark").addEventListener("click", function () {
      console.log(localStorage.getItem("currentPage"));
      const pageSelector = `[page="${localStorage.getItem("currentPage")}"]`;
      const $page = $("#flipbook").find(pageSelector);
      const $img = $page.find("img").first(); // gets first image on the page

      console.log("Page content:");
