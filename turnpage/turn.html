  <script type="text/javascript">
    let display =
      localStorage.getItem("orientation") == 90 ? "double" : "single";

    $("#flipbook").turn({
      height: "100%",
      width: "100%",
      display: display,
      // Restore the saved page
      page: parseInt(localStorage.getItem("currentPage")) || 1,
    });

    const totalPages = $("#flipbook").turn("pages");
    document.getElementById("pages").innerText = totalPages;
    const pageWhileLoaded = $("#flipbook").turn("page");
    document.getElementById("currentPage").innerText = pageWhileLoaded;

    $("#flipbook").bind("turned", function (event, page) {
      localStorage.setItem("currentPage", page);

      document.getElementById("currentPage").innerText = page;
      document.getElementById("pageInput").value = page;

      refreshSelect(page);

      toggleBookmark();
    });

    window.addEventListener("orientationchange", function ($event) {
      console.log(event);
      localStorage.setItem("orientation", window.orientation);
      window.location.reload();
    });

    swipeEvent(document.body);

    function swipeEvent(body) {
      let xDown = null;
      let yDown = null;
      let pinchDetected = false;

      body.addEventListener("touchstart", handleTouchStart, false);
      body.addEventListener("touchmove", handleTouchMove, false);
      body.addEventListener("touchend", handleTouchEnd, false);

      function getDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function handleTouchStart(evt) {
        pinchDetected = false;
        if (evt.touches.length === 1) {
          xDown = evt.touches[0].clientX;
          yDown = evt.touches[0].clientY;
        }
      }

      function handleTouchMove(evt) {
        if (evt.touches.length === 2) {
          pinchDetected = true;
        }
      }

      function handleTouchEnd(evt) {
        if (pinchDetected) return;

        if (!xDown || !yDown) return;

        const xUp = evt.changedTouches[0].clientX;
        const yUp = evt.changedTouches[0].clientY;

        const dx = xUp - xDown;
        const dy = yUp - yDown;

        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 50) {
            fadeAndTurnPage("right");
          } else if (dx < -50) {
            fadeAndTurnPage("left");
          }
        }

        xDown = null;
        yDown = null;
      }

      function fadeAndTurnPage(direction) {
        const viewer = document.getElementById("flipbook");

        // Fade out
        viewer.classList.remove("opacity-100");
        viewer.classList.add("opacity-0");

        // Turn page
        if (direction === "left") {
          $("#flipbook").turn("next");
        } else if (direction === "right") {
          $("#flipbook").turn("previous");
        }

        // Fade in
        setTimeout(() => {
          viewer.classList.remove("opacity-0");
          viewer.classList.add("opacity-100");
        }, 100); // Add slight delay for visual effect
      }
    }

    const select = document.getElementById("pageInput");

    for (let i = 1; i <= totalPages; i++) {
      const option = document.createElement("option");
      option.value = i;
      option.textContent = `Page ${i}`;
      select.appendChild(option);
    }

    document.getElementById("pageInput").value = pageWhileLoaded;

    localStorage.removeItem("currentPageHistory");
    document.getElementById("backPage").style.display = "none";
    document
      .getElementById("pageInput")
      .addEventListener("change", function () {
        const selectedPage = parseInt($(this).val());
        const localStorageCurrentPage = localStorage.getItem("currentPage");
        localStorage.setItem("currentPageHistory", localStorageCurrentPage);
        document.getElementById("backPage").style.display = "flex";
        $("#flipbook").turn("page", selectedPage);
      });

    document.getElementById("flipbook").addEventListener("click", function () {
      const controls = document.getElementById("pagination");
      const bookmarks = document.getElementById("bookmark");

      controls.classList.toggle("hidden");
      bookmarks.classList.toggle("hidden");

      console.log(bookmarks.firstElementChild, bookmarks.lastElementChild);
      toggleBookmark();
    });

    document.getElementById("backPage").addEventListener("click", function () {
      $("#flipbook").turn("page", localStorage.getItem("currentPageHistory"));
      refreshSelect(localStorage.getItem("currentPageHistory"));
      // document.getElementById("backPage").style.display = "none";
      // localStorage.removeItem("currentPageHistory");
    });

    function refreshSelect(page) {
      const pageInput = document.getElementById("pageInput");

      pageInput.blur();

      const $select = $(pageInput);
      setTimeout(() => {
        $select.find("option").prop("selected", false); // Deselect all
        $select.find(`option[value='${page}']`).prop("selected", true); // Select current
      }, 10);
    }

    let bookmarksArray = [];
    if (localStorage.getItem("bookmarks")) {
      bookmarksArray = JSON.parse(localStorage.getItem("bookmarks"));
      loadBookMark();
    }

    document
      .getElementById("mark")
      .addEventListener("click", function ($event) {
        const currentPage = localStorage.getItem("currentPage");
        bookmarksArray = bookmarksArray.filter((i) => i?.page != currentPage);
        localStorage.setItem("bookmarks", JSON.stringify(bookmarksArray));

        toggleBookmark();
         loadBookMark();
      });
    document
      .getElementById("unmark")
      .addEventListener("click", function ($event) {
        const currentPage = localStorage.getItem("currentPage");
        const pageSelector = `[page="${localStorage.getItem("currentPage")}"]`;
        const $page = $("#flipbook").find(pageSelector);
        const $img = $page.find("img").first(); // gets first image on the page

        console.log($img.attr("src"));
        if (!bookmarksArray.some((i) => i?.page == currentPage)) {
          bookmarksArray.push({
            page: currentPage,
            detail: $img.attr("src"),
          });

          toggleBookmark();
           loadBookMark();
        }

        localStorage.setItem("bookmarks", JSON.stringify(bookmarksArray));

        // Tesseract.recognize(
        //   $($img)[0],
        //   "jpn" // language
        // ).then(({ data: { text } }) => {
        //   console.log(text.slice(0,50));
        // });
      });

    function toggleBookmark() {
      const bookmarks = document.getElementById("bookmark");
      console.log(isBookmark());
      if (isBookmark()) {
        bookmarks.lastElementChild.classList.remove("hidden");
        bookmarks.firstElementChild.classList.add("hidden");
      } else {
        bookmarks.firstElementChild.classList.remove("hidden");
        bookmarks.lastElementChild.classList.add("hidden");
      }
     
    }
    function loadBookMark() {
      const tocList = document.getElementById("toc");
      tocList.innerHTML = "";

      bookmarksArray.forEach((item) => {
        const li = document.createElement("li");
        li.style.display = "flex";
        li.style.alignItems = "center";
        li.style.gap = "8px";
        li.style.marginBottom = "8px";
        li.className="toc-item"

        const img = document.createElement("img");
        img.src = item?.detail;
        img.alt = `Avatar for page ${item?.page}`;
        img.style.width = "32px";
        img.style.height = "32px";
        img.style.borderRadius = "50%";
        img.style.objectFit = "cover";

        const span = document.createElement("span");
        span.className="detail"
        span.textContent = `Page ${item?.page}`;

        const svgBookmark = `
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#4A5568" viewBox="0 0 24 24">
    <path d="M6 2C4.895 2 4 2.895 4 4v18l8-4 8 4V4c0-1.105-.895-2-2-2H6z"/>
  </svg>
`;

        // Icon
        const iconWrapper = document.createElement("span");
        iconWrapper.innerHTML = svgBookmark;

        li.appendChild(img);
        li.appendChild(span);
        li.appendChild(iconWrapper);
        // li.textContent = `Page ${item?.page}`;
        li.onclick = () => {
          console.log(item);
          $("#flipbook").turn("page", item?.page);
        };
        tocList.appendChild(li);
      });
    }
    function isBookmark() {
      const currentPage = localStorage.getItem("currentPage");
      if (localStorage.getItem("bookmarks")) {
        const bookmarks = JSON.parse(localStorage.getItem("bookmarks"));
        return bookmarksArray.some((i) => i?.page == currentPage);
      }

      return false;
    }

    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebar-overlay");
    const hoverZone = document.getElementById("bookmarkBtn");

    hoverZone.addEventListener("click", () => {
      sidebar.style.transform = "unset";
      overlay.style.display = "flex";
      // loadBookMark()
    });

    function closeSidebar() {
      sidebar.style.transform = "translateX(-100%)";
      overlay.style.display = "none";
    }

    overlay.addEventListener("click", closeSidebar);

    document.addEventListener("click", (event) => {
      if (
        !sidebar.contains(event.target) &&
        !hoverZone.contains(event.target)
      ) {
        closeSidebar();
      }
    });
  </script>
</html>
